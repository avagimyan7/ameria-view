  <rect x="226" y="168" width="60" height="212" rx="8" fill="#e03131"/>
  <rect x="306" y="218" width="60" height="162" rx="8" fill="#4c6ef5"/>
  <rect x="130" y="380" width="252" height="12" rx="6" fill="#8d95a8"/>
</svg>
